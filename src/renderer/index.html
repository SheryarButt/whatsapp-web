<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO(M7): tighten to script-src 'self' once the UI is served over a
         custom scheme via protocol.handle(); 'unsafe-inline' is here for the
         Vite/react-refresh dev preamble. Scoped to this renderer only — never
         inject a CSP into the WhatsApp partitions. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; base-uri 'none'; frame-src 'none'"
    />
    <title>WhatsApp Multi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
